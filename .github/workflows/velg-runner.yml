# Felles runner-valg (FRA-947): egne runnere først, GitHub sine når de er opptatt.
#
# CI_RUNS_ON (JSON, repo-variabel) er foretrukket runner, f.eks. ["self-hosted","framtid-ci"].
# Er de egne runnerne så godt som fulle, sendes hele kjøringen til ubuntu-latest (inkludert i
# abonnementet) i stedet for å stå i kø. Uten CI_RUNS_ON kjører alt på ubuntu-latest.
#
# Signal 1 (alle repoer): runner-status.yml publiserer hvor mange egne runnere som er opptatt (CI_RUNNER_STATUS).
# Er alle opptatt og tallet er under 20 minutter gammelt, går kjøringen til GitHub.
# Signal 2: jobber i det kallende repoet på self-hosted akkurat nå. Står EN jobb i kø, er alle
# runnerne opptatt, og kjøringen går til GitHub. Uten kø brukes terskelen (sum av kjørende jobber). Last fra ANDRE repoer på de samme runnerne
# ser vi ikke herfra (github.token har ikke org-tilgang). Feiler oppslaget, velges ubuntu-latest.
# Valget gjelder hele kjøringen, så en PR deles ikke mellom to miljøer.
#
# Bruk i kallende repo:
#   jobs:
#     runner:
#       uses: Framtidmedia-no/ci-workflows/.github/workflows/velg-runner.yml@main
#     bygg:
#       needs: runner
#       runs-on: ${{ fromJSON(needs.runner.outputs.etiketter) }}
#
# Kallende jobb må ha `permissions: { actions: read, contents: read }`.
# Variabler i kallende repo: CI_RUNS_ON, CI_OVERLOP_TERSKEL (standard 8 av 9 runnere).
name: Velg runner

on:
  workflow_call:
    inputs:
      github-etiketter:
        description: 'JSON for GitHub-runneren som brukes som fallback, f.eks. "ubuntu-26.04"'
        type: string
        default: '"ubuntu-latest"'
    outputs:
      etiketter:
        description: JSON for runs-on, f.eks. "ubuntu-latest" eller ["self-hosted","framtid-ci"]
        value: ${{ jobs.velg.outputs.etiketter }}

# Ingen permissions-blokk her: en gjenbrukt workflow kan ikke be om mer enn kallende jobb gir, og
# en blokk ville stoppet kallere som bare har `contents: read`. Kallende jobb må gi `actions: read`
# for at oppslaget skal virke. Uten det feiler oppslaget og valget blir ubuntu-latest (trygt).

jobs:
  velg:
    name: Velg runner
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      etiketter: ${{ steps.velg.outputs.etiketter || inputs.github-etiketter }}
    steps:
      - id: velg
        # Jobben skal aldri feile: en feilet jobb hopper over alt som avhenger av den, og hoppet teller som grønt.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ vars.CI_RUNS_ON }}
          GITHUB_VALG: ${{ inputs.github-etiketter }}
          TERSKEL: ${{ vars.CI_OVERLOP_TERSKEL || '8' }}
          # Organisasjonsvariabel fra runner-status.yml: «opptatt,totalt,tidsstempel». Gjelder alle repoer.
          STATUS: ${{ vars.CI_RUNNER_STATUS }}
        run: |
          valg="$GITHUB_VALG"
          grunn="ingen self-hosted konfigurert"
          # Sentral status (alle repoer): fersk (maks 20 min) og alle egne runnere opptatt.
          opptatt_sentralt=0; totalt_sentralt=0; alder_sentralt=999999
          if [ -n "$STATUS" ]; then
            IFS=, read -r opptatt_sentralt totalt_sentralt tid_sentralt <<< "$STATUS"
            alder_sentralt=$(( $(date +%s) - ${tid_sentralt:-0} ))
          fi
          sentralt_fullt() {
            [ "${totalt_sentralt:-0}" -gt 0 ] && [ "${opptatt_sentralt:-0}" -ge "$totalt_sentralt" ] && [ "$alder_sentralt" -le 1200 ]
          }
          if [ -n "$BASE" ] && echo "$BASE" | grep -q 'self-hosted'; then
            belastning=0
            ko=0
            ok=1
            for status in in_progress queued; do
              ider=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?status=$status&per_page=50" --jq ".workflow_runs[] | select(.id != $GITHUB_RUN_ID) | .id") || ok=0
              for id in $ider; do
                n=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=100" --jq '[.jobs[] | select((.status == "in_progress" or .status == "queued") and ((.labels | index("self-hosted")) != null))] | length') || { ok=0; continue; }
                k=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=100" --jq '[.jobs[] | select(.status == "queued" and ((.labels | index("self-hosted")) != null))] | length') || { ok=0; continue; }
                belastning=$((belastning + n))
                ko=$((ko + k))
              done
            done
            if [ "$ok" != 1 ]; then
              grunn="oppslaget feilet, bruker GitHub sine runnere"
            elif sentralt_fullt; then
              grunn="alle egne runnere er opptatt ($opptatt_sentralt av $totalt_sentralt, status $alder_sentralt s gammel): sender til GitHub sine runnere"
            elif [ "$ko" -ge 1 ]; then
              grunn="$ko jobb(er) står i kø på self-hosted, så alle runnerne er opptatt: sender til GitHub sine runnere"
            elif [ "$belastning" -ge "$TERSKEL" ]; then
              grunn="$belastning jobber på self-hosted (terskel $TERSKEL): sender til GitHub sine runnere"
            else
              valg="$BASE"
              grunn="$belastning jobber på self-hosted, ingen i kø: bruker egne runnere"
            fi
          fi
          echo "etiketter=$valg" >> "$GITHUB_OUTPUT"
          echo "Runner: $valg ($grunn)"
          echo "**Runner:** \`$valg\` — $grunn" >> "$GITHUB_STEP_SUMMARY"
