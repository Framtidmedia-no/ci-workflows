# Felles runner-valg (FRA-947): egne runnere først, GitHub sine når de er opptatt.
#
# CI_RUNS_ON (JSON, repo-variabel) er foretrukket runner, f.eks. ["self-hosted","framtid-ci"].
# Er de egne runnerne så godt som fulle, sendes hele kjøringen til ubuntu-latest (inkludert i
# abonnementet) i stedet for å stå i kø. Uten CI_RUNS_ON kjører alt på ubuntu-latest.
#
# Signal 1 (alle repoer): runner-status.yml publiserer hvor mange egne runnere som er opptatt (CI_RUNNER_STATUS).
# Er alle opptatt og tallet er under 3 minutter gammelt, går kjøringen til GitHub. Tallet skrives
# hvert 30. sekund (maks ett minutt gammelt) av timeren ci-runner-status på framtid-fs-worker
# (GR-664). runner-status.yml på GitHub-cron er bare sikkerhetsnett: den kjører i praksis hvert
# 13-22. minutt, så den alene ville gjort signalet utløpt mesteparten av tiden. Faller timeren ut,
# blir tallet for gammelt og vi går tilbake til signal 2 (egne runnere brukes først).
# Signal 2: jobber i det kallende repoet på self-hosted akkurat nå. Står EN jobb i kø, er alle
# runnerne opptatt, og kjøringen går til GitHub. Uten kø brukes terskelen (sum av kjørende jobber). Last fra ANDRE repoer på de samme runnerne
# ser vi ikke herfra (github.token har ikke org-tilgang). Feiler oppslaget, velges ubuntu-latest.
# Valget gjelder hele kjøringen, så en PR deles ikke mellom to miljøer.
#
# Bruk i kallende repo:
#   jobs:
#     runner:
#       uses: Framtidmedia-no/ci-workflows/.github/workflows/velg-runner.yml@main
#     bygg:
#       needs: runner
#       runs-on: ${{ fromJSON(needs.runner.outputs.etiketter) }}
#
# Kallende jobb må ha `permissions: { actions: read, contents: read }`.
# Variabler i kallende repo: CI_RUNS_ON, CI_ALDRI_OVERLOP (true = aldri overløp til GitHub, jobbene står i kø på egne runnere;
# bruk på repoer med tung, parallell CI der betalte minutter ellers løper løpsk), CI_OVERLOP_TERSKEL (standard 12 av 14 runnere, fordelt på framtid-ci-2 og framtid-ci-3).
name: Velg runner

on:
  workflow_call:
    inputs:
      github-etiketter:
        description: 'JSON for GitHub-runneren som brukes som fallback, f.eks. "ubuntu-26.04"'
        type: string
        default: '"ubuntu-latest"'
    outputs:
      etiketter:
        description: JSON for runs-on, f.eks. "ubuntu-latest" eller ["self-hosted","framtid-ci"]
        value: ${{ jobs.velg.outputs.etiketter }}

# Ingen permissions-blokk her: en gjenbrukt workflow kan ikke be om mer enn kallende jobb gir, og
# en blokk ville stoppet kallere som bare har `contents: read`. Kallende jobb må gi `actions: read`
# for at oppslaget skal virke. Uten det feiler oppslaget og valget blir ubuntu-latest (trygt).

jobs:
  velg:
    name: Velg runner
    # FRA-2060: med CI_ALDRI_OVERLOP=true er svaret alltid egne runnere, så selve valget kan kjøre der og
    # koster ingen hostet minuttjobb. Repoer MED overløp må velge fra en hostet runner: er alle egne opptatt,
    # ville valget ellers stått i den samme køen det skal hjelpe oss ut av. Jobben henter aldri PR-kode.
    # sentry/*, fork, bot-kontoer, ubeskyttede refs og ukjente hendelser blir på GitHub sine engangsrunnere.
    runs-on: ${{ (startsWith(github.head_ref || github.ref_name, 'sentry/') || (github.event.pull_request.number && github.event.pull_request.head.repo.full_name != github.repository) || github.event.pull_request.user.type == 'Bot' || github.event.sender.type == 'Bot' || endsWith(github.actor, '[bot]') || endsWith(github.triggering_actor, '[bot]') || startsWith(github.head_ref, 'renovate/') || startsWith(github.head_ref, 'dependabot/') || ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && !github.ref_protected) || !contains(fromJSON('["pull_request","push","workflow_dispatch","schedule","merge_group"]'), github.event_name)) && 'ubuntu-latest' || (vars.CI_ALDRI_OVERLOP == 'true' && contains(vars.CI_RUNS_ON, 'self-hosted')) && fromJSON(vars.CI_RUNS_ON) || 'ubuntu-latest' }}
    timeout-minutes: 3
    outputs:
      # Fork får GitHub sin runner også hvis steget under skulle feile og kalleren har satt egne etiketter.
      etiketter: ${{ (github.event.pull_request.number && github.event.pull_request.head.repo.full_name != github.repository) && '"ubuntu-latest"' || steps.velg.outputs.etiketter || (contains(inputs.github-etiketter, 'self-hosted') && '"ubuntu-latest"' || inputs.github-etiketter) }}
    steps:
      - id: velg
        # Jobben skal aldri feile: en feilet jobb hopper over alt som avhenger av den, og hoppet teller som grønt.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ vars.CI_RUNS_ON }}
          GITHUB_VALG: ${{ inputs.github-etiketter }}
          TERSKEL: ${{ vars.CI_OVERLOP_TERSKEL || '12' }}
          # Organisasjonsvariabel fra runner-status.yml: «opptatt,totalt,tidsstempel». Gjelder alle repoer.
          STATUS: ${{ vars.CI_RUNNER_STATUS }}
          # Repo-variabel CI_ALDRI_OVERLOP=true: aldri send kjøringen til GitHub fordi egne runnere er opptatt. Jobbene står i kø i stedet.
          ALDRI_OVERLOP: ${{ vars.CI_ALDRI_OVERLOP }}
          GREN: ${{ github.head_ref || github.ref_name }}
          HENDELSE: ${{ github.event_name }}
          PR_NUMMER: ${{ github.event.pull_request.number }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          # Satt av GitHub, kan ikke styres fra PR-innhold.
          PR_FORFATTER_TYPE: ${{ github.event.pull_request.user.type }}
          SENDER_TYPE: ${{ github.event.sender.type }}
          AKTOR: ${{ github.actor }}
          UTLOSER: ${{ github.triggering_actor }}
          REF_BESKYTTET: ${{ github.ref_protected }}
        run: |
          # >>> velg
          valg="$GITHUB_VALG"
          grunn="ingen self-hosted konfigurert"
          # FRA-2060: fork-kode skal aldri på de persistente runnerne. Gjelder pull_request og pull_request_target,
          # og et tomt head-repo (slettet fork) regnes som fork.
          er_fork=false
          case "$HENDELSE" in
            pull_request|pull_request_target) [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ] || er_fork=true ;;
            *) if [ -n "${PR_NUMMER:-}" ] && [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then er_fork=true; fi ;;
          esac
          # FRA-2060: egne runnere er persistente. Alt som kjører tredjepartskode eller kode fra ubeskyttede refs
          # holdes unna. Listen over hendelser er en tillatelsesliste: alt ukjent går til GitHub.
          hostet_grunn=""
          [ "$er_fork" = "true" ] && hostet_grunn="PR fra fork"
          if [ "${PR_FORFATTER_TYPE:-}" = "Bot" ] || [ "${SENDER_TYPE:-}" = "Bot" ] || [[ "${AKTOR:-}" == *"[bot]" ]] || [[ "${UTLOSER:-}" == *"[bot]" ]]; then
            hostet_grunn="bot-konto"
          fi
          case "$GREN" in renovate/*|dependabot/*) hostet_grunn="avhengighetsbranch" ;; esac
          case "$HENDELSE" in
            pull_request|schedule|merge_group) ;;
            push|workflow_dispatch) [ "${REF_BESKYTTET:-}" = "true" ] || hostet_grunn="$HENDELSE på ubeskyttet ref" ;;
            *) hostet_grunn="hendelsen $HENDELSE" ;;
          esac
          # Sentral status (alle repoer): fersk (maks 3 min, se toppen) og alle egne runnere opptatt.
          opptatt_sentralt=0; totalt_sentralt=0; alder_sentralt=999999
          # Bare «tall,tall,tall» godtas, så verdien aldri kan tolkes som kode i aritmetikken under.
          if [[ "$STATUS" =~ ^[0-9]{1,4},[0-9]{1,4},[0-9]{1,12}$ ]]; then
            IFS=, read -r opptatt_sentralt totalt_sentralt tid_sentralt <<< "$STATUS"
            alder_sentralt=$(( $(date +%s) - ${tid_sentralt:-0} ))
          fi
          sentralt_fullt() {
            [ "${totalt_sentralt:-0}" -gt 0 ] && [ "${opptatt_sentralt:-0}" -ge "$totalt_sentralt" ] && [ "$alder_sentralt" -le 180 ]
          }
          if [ -n "$hostet_grunn" ]; then
            # Først i kjeden, så ingen annen gren kan sette $BASE. Også github-etiketter overstyres.
            valg='"ubuntu-latest"'
            grunn="$hostet_grunn: kjøres bare på GitHub sine engangsrunnere"
          elif [[ "$GREN" == sentry/* ]]; then
            # Agent-brancher (FRA-1976) kjører kode fra Sentry-agenten. Den skal aldri på faste egne runnere,
            # der den kunne lagt igjen noe for neste jobb: alltid GitHub sine engangsrunnere.
            grunn="sentry/*-branch: kode fra Sentry-agenten kjøres bare på GitHub sine engangsrunnere"
          elif [ "$ALDRI_OVERLOP" = "true" ] && [ -n "$BASE" ] && echo "$BASE" | grep -q 'self-hosted'; then
            # Kø er gratis, GitHub-minutter er ikke det: la jobbene vente på egne runnere uansett hvor travelt det er.
            valg="$BASE"
            grunn="CI_ALDRI_OVERLOP=true: venter i kø på egne runnere, sender aldri til GitHub fordi de er opptatt"
          elif [ -n "$BASE" ] && echo "$BASE" | grep -q 'self-hosted'; then
            belastning=0
            ko=0
            ok=1
            for status in in_progress queued; do
              ider=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?status=$status&per_page=50" --jq ".workflow_runs[] | select(.id != $GITHUB_RUN_ID) | .id") || ok=0
              for id in $ider; do
                n=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=100" --jq '[.jobs[] | select((.status == "in_progress" or .status == "queued") and ((.labels | index("self-hosted")) != null))] | length') || { ok=0; continue; }
                k=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=100" --jq '[.jobs[] | select(.status == "queued" and ((.labels | index("self-hosted")) != null))] | length') || { ok=0; continue; }
                belastning=$((belastning + n))
                ko=$((ko + k))
              done
            done
            if [ "$ok" != 1 ]; then
              grunn="oppslaget feilet, bruker GitHub sine runnere"
            elif sentralt_fullt; then
              grunn="alle egne runnere er opptatt ($opptatt_sentralt av $totalt_sentralt, status $alder_sentralt s gammel): sender til GitHub sine runnere"
            elif [ "$ko" -ge 1 ]; then
              grunn="$ko jobb(er) står i kø på self-hosted, så alle runnerne er opptatt: sender til GitHub sine runnere"
            elif [ "$belastning" -ge "$TERSKEL" ]; then
              grunn="$belastning jobber på self-hosted (terskel $TERSKEL): sender til GitHub sine runnere"
            else
              valg="$BASE"
              grunn="$belastning jobber på self-hosted, ingen i kø: bruker egne runnere"
            fi
          fi
          echo "etiketter=$valg" >> "$GITHUB_OUTPUT"
          echo "Runner: $valg ($grunn)"
          echo "**Runner:** \`$valg\` — $grunn" >> "$GITHUB_STEP_SUMMARY"
          # <<< velg
