# Felles lint-port for Framtidmedia-no, Gange-Rolv-AS og frlund3.
#
# To porter, ingen per-repo-konfig:
#   1. ENDREDE FILER: ESLint på filene PR-en rører. Feil der blokkerer merge —
#      ny kode er alltid ren, og etterslepet ryddes der man jobber.
#   2. TERSKEL MOT BASE: totalt antall ESLint-feil på PR-en må ikke være høyere
#      enn på base-branchen. Terskelen er dermed alltid «dagens nivå» og
#      ratchet-er seg ned av seg selv — ingen tall å vedlikeholde.
#
# ADVARSLER (opt-in): uten `maks-advarsler` telles ikke advarsler (som før).
# Med `maks-advarsler: 0` (eller et annet tall) gjelder i tillegg:
#   1. Endrede filer feiler på flere advarsler enn tallet (--max-warnings).
#   2. Antall advarsler på hele repoet i PR-en må ikke være høyere enn på base
#      (samme ratchet som for feil). Et repo med 5 advarsler i dag blir altså
#      ikke felt av gamle advarsler, bare av nye.
#
# Repoet kaller den med:
#   jobs:
#     lint-port:
#       uses: Framtidmedia-no/ci-workflows/.github/workflows/lint-gate.yml@main
#
# Monorepo med ESLint per app: én jobb per app via `working-directory`
# (gjerne som matrix). Install skjer alltid på repo-roten der lockfila
# ligger; ESLint og typecheck kjører fra katalogen, og Port 1 teller bare
# endrede filer under den.
#
# Pakkebehandler oppdages fra lockfila. Repoer uten eslint i node_modules
# hopper over begge portene med en notice i stedet for å feile.
name: Lint-port

on:
  workflow_call:
    inputs:
      node-version:
        description: Node-versjon (brukes bare hvis repoet ikke har .nvmrc/.node-version)
        type: string
        default: '24'
      pnpm-version:
        description: pnpm-versjon hvis package.json mangler packageManager-feltet
        type: string
        default: '11'
      eslint-args:
        description: Argumenter til ESLint for hele-repoet-tellingen
        type: string
        default: '.'
      maks-advarsler:
        description: >-
          Tom (default) = advarsler telles ikke. Et tall (f.eks. '0') gjør advarsler til
          en del av porten: endrede filer får --max-warnings <tall>, og antall advarsler
          på hele repoet må ikke øke mot base.
        type: string
        default: ''
      typecheck:
        description: Kjør også tsc --noEmit (for repoer uten egen CI)
        type: boolean
        default: false
      typecheck-command:
        description: Overstyr typecheck-kommandoen (default `<pm> exec tsc --noEmit`)
        type: string
        default: ''
      working-directory:
        description: Katalog ESLint og typecheck kjører fra (monorepo-app). Install skjer alltid på repo-roten.
        type: string
        default: '.'

jobs:
  # FRA-947: egne runnere først, GitHub sine når de er opptatt. Kallende jobb må ha `actions: read`
  # for at valget skal kunne se køen; uten det brukes GitHub sine runnere. Se velg-runner.yml.
  runner:
    name: Velg runner
    uses: Framtidmedia-no/ci-workflows/.github/workflows/velg-runner.yml@3398ce4b1f95faef89b3dca562afd9cde9c95e7c # main

  lint-port:
    name: Lint-port (endrede filer + terskel mot base)
    needs: runner
    runs-on: ${{ fromJSON(needs.runner.outputs.etiketter) }}
    timeout-minutes: 20
    env:
      WD: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Oppdag pakkebehandler
        id: pm
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
            echo "run=pnpm exec" >> "$GITHUB_OUTPUT"
            echo "install=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "pm=yarn" >> "$GITHUB_OUTPUT"
            echo "run=yarn" >> "$GITHUB_OUTPUT"
            echo "install=yarn install --frozen-lockfile" >> "$GITHUB_OUTPUT"
          else
            echo "pm=npm" >> "$GITHUB_OUTPUT"
            echo "run=npx --no-install" >> "$GITHUB_OUTPUT"
            echo "install=npm ci" >> "$GITHUB_OUTPUT"
          fi
          if [ -f .nvmrc ]; then echo "node-file=.nvmrc" >> "$GITHUB_OUTPUT"
          elif [ -f .node-version ]; then echo "node-file=.node-version" >> "$GITHUB_OUTPUT"
          else echo "node-file=" >> "$GITHUB_OUTPUT"; fi
          if grep -q '"packageManager"' package.json; then echo "pnpm-version=" >> "$GITHUB_OUTPUT"
          else echo "pnpm-version=${{ inputs.pnpm-version }}" >> "$GITHUB_OUTPUT"; fi

      - name: Sett opp pnpm
        if: steps.pm.outputs.pm == 'pnpm'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: ${{ steps.pm.outputs.pnpm-version }}

      - name: Sett opp Node (versjonsfil)
        if: steps.pm.outputs.node-file != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: ${{ steps.pm.outputs.node-file }}
          cache: ${{ steps.pm.outputs.pm }}

      - name: Sett opp Node (input)
        if: steps.pm.outputs.node-file == ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ steps.pm.outputs.pm }}

      - name: Installer avhengigheter
        shell: bash
        run: ${{ steps.pm.outputs.install }}

      - name: Finnes ESLint?
        id: eslint
        shell: bash
        run: |
          # Roten (vanlig repo, npm-workspaces hoister dit) eller katalogen
          # selv (pnpm-workspace legger binæren i appens node_modules).
          if [ -x node_modules/.bin/eslint ] || [ -x "$WD/node_modules/.bin/eslint" ]; then
            echo "finnes=true" >> "$GITHUB_OUTPUT"
          else
            echo "finnes=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ESLint er ikke installert i $WD — lint-porten hopper over."
          fi

      - name: "Port 1: ESLint på endrede filer"
        if: steps.eslint.outputs.finnes == 'true'
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MAKS_ADVARSLER: ${{ inputs.maks-advarsler }}
        run: |
          set -o pipefail
          # --relative: bare filer under working-directory, med sti relativt til den.
          mapfile -t FILER < <(git diff --name-only --relative --diff-filter=ACMR "$BASE_SHA"...HEAD -- '*.ts' '*.tsx' '*.js' '*.jsx' '*.mjs' '*.cjs' | while read -r f; do [ -f "$f" ] && echo "$f"; done)
          if [ "${#FILER[@]}" -eq 0 ]; then
            echo "Ingen endrede JS/TS-filer i PR-en (under $WD)."
            exit 0
          fi
          echo "Linter ${#FILER[@]} endrede fil(er) i $WD:"
          printf '  %s\n' "${FILER[@]}"
          ARGS=(--no-warn-ignored)
          if [ -n "$MAKS_ADVARSLER" ]; then
            if ! [[ "$MAKS_ADVARSLER" =~ ^[0-9]+$ ]]; then
              echo "::error::maks-advarsler må være et heltall eller tom, fikk '$MAKS_ADVARSLER'."
              exit 1
            fi
            ARGS+=(--max-warnings "$MAKS_ADVARSLER")
            echo "Advarsler i endrede filer teller (maks $MAKS_ADVARSLER)."
          fi
          if ! ${{ steps.pm.outputs.run }} eslint "${ARGS[@]}" "${FILER[@]}"; then
            if [ -n "$MAKS_ADVARSLER" ]; then
              echo "::error::Lint-port 1 feilet: feil eller flere enn $MAKS_ADVARSLER advarsler i filene PR-en endrer. Rett opp advarslene (kjør '${{ steps.pm.outputs.run }} eslint <fil>' lokalt)."
            fi
            exit 1
          fi

      - name: "Port 2: terskel mot base (feil, og advarsler hvis maks-advarsler er satt, må ikke øke)"
        if: steps.eslint.outputs.finnes == 'true'
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          RUN: ${{ steps.pm.outputs.run }}
          INSTALL: ${{ steps.pm.outputs.install }}
          ESLINT_ARGS: ${{ inputs.eslint-args }}
          MAKS_ADVARSLER: ${{ inputs.maks-advarsler }}
        run: |
          tell() {  # skriver "<errors> <warnings>" til stdout, eller "ukjent" hvis eslint ikke kunne kjøre
            local ut="$1"
            rm -f "$ut"
            $RUN eslint $ESLINT_ARGS -f json -o "$ut" >/dev/null 2>&1 || true
            if [ -s "$ut" ]; then
              node -e "const r=require(process.argv[1]);console.log(r.reduce((a,f)=>a+f.errorCount,0)+' '+r.reduce((a,f)=>a+f.warningCount,0))" "$ut"
            else
              echo ukjent
            fi
          }
          HODE_ROT=$(pwd)
          HODE_UT=$(tell /tmp/eslint-hode.json)
          if [ "$HODE_UT" = "ukjent" ]; then
            echo "::error::ESLint kunne ikke kjøre på PR-en (krasj eller ugyldig config). Kjør '$RUN eslint $ESLINT_ARGS' lokalt i $WD."
            $RUN eslint $ESLINT_ARGS 2>&1 | tail -40 || true
            exit 1
          fi
          read -r HODE HODE_ADV <<< "$HODE_UT"

          # Base lintes i et worktree: install på roten der lockfila ligger,
          # ESLint fra samme underkatalog som PR-en.
          git worktree add --detach /tmp/base "$BASE_SHA" >/dev/null 2>&1
          pushd /tmp/base >/dev/null
          if $INSTALL >/dev/null 2>&1 && cd "$WD"; then
            BASE_ROT=$(pwd)
            BASE_UT=$(tell /tmp/eslint-base.json)
          else
            BASE_ROT=/tmp/base
            BASE_UT=ukjent
          fi
          popd >/dev/null

          if [ "$BASE_UT" = "ukjent" ]; then
            BASE=ukjent
          else
            read -r BASE BASE_ADV <<< "$BASE_UT"
          fi

          echo "Lint-errors: PR=$HODE  base=$BASE"
          if [ -n "$MAKS_ADVARSLER" ]; then
            echo "Lint-advarsler: PR=$HODE_ADV  base=${BASE_ADV:-ukjent}"
          fi
          if [ "$BASE" = "ukjent" ]; then
            echo "::notice::Kunne ikke måle lint på base-branchen — porten gater kun på at PR-en linter."
            exit 0
          fi
          if [ "$HODE" -gt "$BASE" ]; then
            echo "::error::Lint-errors økte fra $BASE (base) til $HODE (PR). Nye feil må fikses før merge."
            HODE_ROT="$HODE_ROT" BASE_ROT="$BASE_ROT" node -e "
              const b=require('/tmp/eslint-base.json'), h=require('/tmp/eslint-hode.json');
              const per=(r,rot)=>Object.fromEntries(r.map(f=>[f.filePath.replace(rot+'/',''),f.errorCount]));
              const pb=per(b,process.env.BASE_ROT), ph=per(h,process.env.HODE_ROT);
              for (const [f,n] of Object.entries(ph)) if (n>(pb[f]||0)) console.log('  +'+(n-(pb[f]||0))+'  '+f);
            "
            exit 1
          fi
          if [ "$HODE" -lt "$BASE" ]; then
            echo "::notice::Lint-errors gikk ned fra $BASE til $HODE. Takk!"
          fi

          # Advarsler: bare med maks-advarsler satt (opt-in), ellers som før.
          if [ -n "$MAKS_ADVARSLER" ]; then
            if [ "$HODE_ADV" -gt "$BASE_ADV" ]; then
              echo "::error::Lint-advarsler økte fra $BASE_ADV (base) til $HODE_ADV (PR). Nye advarsler må fikses før merge."
              HODE_ROT="$HODE_ROT" BASE_ROT="$BASE_ROT" node -e "
                const b=require('/tmp/eslint-base.json'), h=require('/tmp/eslint-hode.json');
                const per=(r,rot)=>Object.fromEntries(r.map(f=>[f.filePath.replace(rot+'/',''),f.warningCount]));
                const pb=per(b,process.env.BASE_ROT), ph=per(h,process.env.HODE_ROT);
                for (const [f,n] of Object.entries(ph)) if (n>(pb[f]||0)) console.log('  +'+(n-(pb[f]||0))+'  '+f);
              "
              exit 1
            fi
            if [ "$HODE_ADV" -lt "$BASE_ADV" ]; then
              echo "::notice::Lint-advarsler gikk ned fra $BASE_ADV til $HODE_ADV. Takk!"
            fi
          fi

      - name: Typecheck
        if: inputs.typecheck
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        run: |
          if [ -n "${{ inputs.typecheck-command }}" ]; then
            ${{ inputs.typecheck-command }}
          else
            ${{ steps.pm.outputs.run }} tsc --noEmit
          fi
