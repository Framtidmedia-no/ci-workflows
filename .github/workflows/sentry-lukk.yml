# Sentry-lukk: markerer Sentry-saken «løst i neste release» når fiksen merges (FRA-1976).
# Gjelder både agentens egne PR-er og fikser merget for hånd, så lenge branchnavnet har Linear-ID-en (fix/FRA-123-…).
#
# Kobling: merget PR → Linear-ID først i et branch-segment → Sentry-lenker i vedlegg og beskrivelse på Linear-saken → Sentry-sak.
# Bare uløste saker fra et prosjekt som peker på nettopp dette repoet i sentry-repoer.json røres (scripts/sentry-agent/lukk.mjs).
# «Løst i neste release»: hendelser fra releaser som allerede kjører (prod før promotering) gjenåpner ikke saken,
# men den blir en regresjon hvis feilen kommer igjen i en nyere release.
#
# Kalles fra kalleren i hvert repo (generert av framtid-security, workflows/sentry-agent.yml):
#   on: pull_request: types: [closed]
#   jobs:
#     sentry-lukk:
#       if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
#       permissions: { contents: read, pull-requests: write }
#       uses: Framtidmedia-no/ci-workflows/.github/workflows/sentry-lukk.yml@<SHA> # main
#       with: { ci-ref: <samme SHA> }
#       secrets: SENTRY_READ_TOKEN, SENTRY_WRITE_TOKEN, LINEAR_API_KEY (eksplisitt, aldri inherit)
#
# Kjører aldri repoets kode: bare scripts fra ci-workflows på ci-ref. Branchnavnet er ubetrodd og går bare via env.
name: Sentry-lukk

on:
  workflow_call:
    inputs:
      ci-ref:
        description: Ref i ci-workflows som scripts og sentry-repoer.json hentes fra. Kalleren setter samme SHA som i uses
        type: string
        default: main
    secrets:
      SENTRY_READ_TOKEN:
        required: false
      SENTRY_WRITE_TOKEN:
        required: false
      LINEAR_API_KEY:
        required: false

permissions:
  contents: read

env:
  SENTRY_API: https://de.sentry.io/api/0
  SENTRY_ORG: framtid-tech-as

jobs:
  lukk:
    name: Marker Sentry-saker løst
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    env:
      REPO: ${{ github.repository }}
      SA: ${{ github.workspace }}/../sentry-lukk-ci
      PR_NUMMER: ${{ github.event.pull_request.number }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      MERGET: ${{ github.event.pull_request.merged }}
      HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Sjekk hendelse og hemmeligheter
        id: start
        env:
          HAR_SENTRY: ${{ secrets.SENTRY_READ_TOKEN != '' && secrets.SENTRY_WRITE_TOKEN != '' }}
          HAR_LINEAR: ${{ secrets.LINEAR_API_KEY != '' }}
        run: |
          set -euo pipefail
          stopp() { echo "::notice::$1"; echo "kjor=false" >> "$GITHUB_OUTPUT"; exit 0; }
          [ "$GITHUB_EVENT_NAME" = "pull_request" ] || stopp "Ikke en pull_request-hendelse ($GITHUB_EVENT_NAME)."
          [ "$MERGET" = "true" ] || stopp "PR-en er lukket uten merge."
          # Bare PR-er fra repoet selv. Fork-PR-er får uansett ikke hemmeligheter.
          [ "${HEAD_REPO,,}" = "${REPO,,}" ] || stopp "PR fra et annet repo ($HEAD_REPO)."
          [[ "$PR_NUMMER" =~ ^[0-9]{1,10}$ ]] || { echo "::error::Ugyldig PR-nummer"; exit 1; }
          mangler=""
          [ "$HAR_SENTRY" = "true" ] || mangler="$mangler SENTRY_READ_TOKEN/SENTRY_WRITE_TOKEN"
          [ "$HAR_LINEAR" = "true" ] || mangler="$mangler LINEAR_API_KEY"
          [ -z "$mangler" ] || stopp "Mangler hemmeligheter:$mangler. Hopper over."
          echo "kjor=true" >> "$GITHUB_OUTPUT"

      - name: Hent scripts fra ci-workflows
        if: steps.start.outputs.kjor == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Framtidmedia-no/ci-workflows
          ref: ${{ inputs.ci-ref }}
          path: sentry-lukk-ci
          persist-credentials: false

      - name: Flytt scripts ut av arbeidsmappen
        if: steps.start.outputs.kjor == 'true'
        run: mv sentry-lukk-ci "$SA"

      - name: Finn Sentry-saker via Linear
        id: finn
        if: steps.start.outputs.kjor == 'true'
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          set -euo pipefail
          # Linear nede eller ugyldig nøkkel skal ikke gi rødt kryss på hver merge: advarsel og stopp.
          stopp() { echo "::warning::$1"; echo "kjor=false" >> "$GITHUB_OUTPUT"; exit 0; }
          gql() { curl -sS --fail-with-body --max-time 30 https://api.linear.app/graphql -H "Authorization: $LINEAR_API_KEY" -H 'Content-Type: application/json' -d "$1"; }
          svar=$(gql '{"query":"{teams(first:100){nodes{key}}}"}') || stopp "Linear svarte ikke. Sentry-saker er ikke lukket."
          jq -ce '[.data.teams.nodes[]?.key] | select(length > 0)' <<<"$svar" > "$RUNNER_TEMP/team.json" || stopp "Fikk ingen Linear-team. Sentry-saker er ikke lukket."
          node "$SA/scripts/sentry-agent/lukk.mjs" --linear "$HEAD_REF" "$RUNNER_TEMP/team.json" > "$RUNNER_TEMP/linear.json"
          if [ "$(jq length "$RUNNER_TEMP/linear.json")" = "0" ]; then
            echo "::notice::Ingen Linear-ID først i et segment av branchnavnet. Ingenting å lukke."
            echo "kjor=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Sentry-lenker fra vedlegg (agentens saker) og beskrivelsen (saker laget for hånd, ofte med kort-ID).
          : > "$RUNNER_TEMP/saker.jsonl"
          for id in $(jq -r '.[]' "$RUNNER_TEMP/linear.json"); do
            svar=$(gql "$(jq -n --arg i "$id" '{query:"query($i:String!){issue(id:$i){description attachments(first:50){nodes{url}}}}",variables:{i:$i}}')") || { echo "::warning::Fant ikke $id i Linear."; continue; }
            jq -c '{vedlegg: [.data.issue.attachments.nodes[]?.url], beskrivelse: (.data.issue.description // "")}' <<<"$svar" >> "$RUNNER_TEMP/saker.jsonl" \
              || echo "::warning::Uventet svar fra Linear for $id."
          done
          jq -s '.' "$RUNNER_TEMP/saker.jsonl" > "$RUNNER_TEMP/saker.json"
          node "$SA/scripts/sentry-agent/lukk.mjs" --linear-saker "$RUNNER_TEMP/saker.json" "$SENTRY_ORG" > "$RUNNER_TEMP/sentry.json"
          echo "Linear: $(jq -c . "$RUNNER_TEMP/linear.json") · Sentry: $(jq -c . "$RUNNER_TEMP/sentry.json")"
          if [ "$(jq length "$RUNNER_TEMP/sentry.json")" = "0" ]; then
            echo "::notice::Linear-sakene har ingen Sentry-lenke. Ingenting å lukke."
            echo "kjor=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "kjor=true" >> "$GITHUB_OUTPUT"

      - name: Marker løst i neste release
        if: steps.finn.outputs.kjor == 'true'
        env:
          SENTRY_READ_TOKEN: ${{ secrets.SENTRY_READ_TOKEN }}
          SENTRY_WRITE_TOKEN: ${{ secrets.SENTRY_WRITE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api() { local tok="$1"; shift; curl -sS --fail-with-body --max-time 30 -H "Authorization: Bearer $tok" -H 'Content-Type: application/json' "$@"; }
          avvist=""
          {
            echo "### Sentry-lukk"
            echo "| Sentry-sak | Resultat |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          # ref er numerisk ID eller kort-ID (MOBILE-DRIFT-3). Sentry godtar begge. Lukking skjer med den numeriske ID-en fra svaret.
          for ref in $(jq -r '.[]' "$RUNNER_TEMP/sentry.json"); do
            [[ "$ref" =~ ^([0-9]{1,20}|[A-Z0-9][A-Z0-9-]{0,98}-[A-Z0-9]{1,10})$ ]] || continue
            if ! api "$SENTRY_READ_TOKEN" "$SENTRY_API/organizations/$SENTRY_ORG/issues/$ref/" > "$RUNNER_TEMP/sak.json"; then
              echo "| $ref | fant ikke saken |" >> "$GITHUB_STEP_SUMMARY"; continue
            fi
            sid=$(jq -r '.id // ""' "$RUNNER_TEMP/sak.json")
            [[ "$sid" =~ ^[0-9]{1,20}$ ]] || { echo "| $ref | ugyldig svar fra Sentry |" >> "$GITHUB_STEP_SUMMARY"; continue; }
            kort=$(jq -r '.shortId // ""' "$RUNNER_TEMP/sak.json")
            vurdering=$(node "$SA/scripts/sentry-agent/lukk.mjs" --vurder "$RUNNER_TEMP/sak.json" "$REPO" "$SA/sentry-repoer.json")
            if [ "$(jq -r .lukk <<<"$vurdering")" != "true" ]; then
              echo "| $kort | hoppet over: $(jq -r .grunn <<<"$vurdering") |" >> "$GITHUB_STEP_SUMMARY"; continue
            fi
            if svar=$(api "$SENTRY_WRITE_TOKEN" -X PUT "$SENTRY_API/organizations/$SENTRY_ORG/issues/$sid/" \
                -d '{"status":"resolved","statusDetails":{"inNextRelease":true}}'); then
              echo "Sentry-sak $kort: $(jq -r '.status + " " + ((.statusDetails // {}) | keys | join(","))' <<<"$svar")"
              echo "| $kort | løst i neste release |" >> "$GITHUB_STEP_SUMMARY"
              api "$SENTRY_WRITE_TOKEN" -X POST "$SENTRY_API/organizations/$SENTRY_ORG/issues/$sid/comments/" \
                -d "$(jq -n --arg t "Sentry-lukk: fiksen er merget i $PR_URL. Saken er markert løst i neste release." '{text:$t}')" >/dev/null \
                || echo "::warning::Kunne ikke kommentere $kort i Sentry."
            else
              echo "::warning::Sentry avviste «løst i neste release» for $kort (mangler prosjektet releaser?). Saken står uløst."
              echo "| $kort | **avvist av Sentry, står uløst** |" >> "$GITHUB_STEP_SUMMARY"
              avvist="$avvist $kort"
            fi
          done
          if [ -n "$avvist" ]; then
            gh pr comment "$PR_NUMMER" --repo "$REPO" --body "Sentry-lukk (FRA-1976): Sentry avviste «løst i neste release» for$avvist. Sakene står uløst og må lukkes etter prod-bevis. Mangler prosjektet releaser i Sentry?" \
              || echo "::warning::Kunne ikke kommentere på PR-en."
          fi
