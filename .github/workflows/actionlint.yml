# Workflow-lint for ci-workflows selv (FRA-1815). Repoet er kilden alle andre repoer henter workflows fra,
# så en ugyldig workflow her treffer alle konsumentene ved neste SHA-bump. actionlint fanger syntaksfeil,
# feil i `${{ }}`-uttrykk, ukjente inputs/outputs mellom reusable workflows og feil `needs`.
#
# Låst versjon med sjekksum, som gitleaks/osv i sikkerhet.yml. Sjekksummene er målt mot nedlastede filer
# og de publiserte actionlint_1.7.12_checksums.txt (08.11.2026).
# shellcheck/pyflakes er bevisst av i første omgang: de ville flagget eksisterende stil i run-skriptene og
# gjort sjekken rød før den kan kreves. Slås på i egen PR når funnene er ryddet.
name: Workflow-lint
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
env:
  ACTIONLINT_VERSION: '1.7.12'
  ACTIONLINT_SHA256_X64: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
  ACTIONLINT_SHA256_ARM64: '325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6'
jobs:
  actionlint:
    name: Workflow-lint (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Installer actionlint
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) a=linux_amd64; sha="$ACTIONLINT_SHA256_X64" ;;
            aarch64|arm64) a=linux_arm64; sha="$ACTIONLINT_SHA256_ARM64" ;;
            *) echo "::error::Ukjent arkitektur $(uname -m)"; exit 1 ;;
          esac
          fil="actionlint_${ACTIONLINT_VERSION}_${a}.tar.gz"
          mappe="$RUNNER_TEMP/actionlint"
          mkdir -p "$mappe"
          curl -fsSL --retry 3 --retry-delay 2 --max-time 120 -o "$mappe/$fil" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$fil"
          if ! echo "$sha  $mappe/$fil" | sha256sum -c -; then
            echo "::error::Sjekksummen for actionlint stemmer ikke. Stopper i stedet for å kjøre en uverifisert binær."
            exit 1
          fi
          tar -xzf "$mappe/$fil" -C "$mappe" actionlint
          echo "$mappe" >> "$GITHUB_PATH"

      - name: Lint alle workflows
        run: actionlint -color -shellcheck= -pyflakes=
