# Felles «hopp over det som allerede er testet» (FRA-863, utvidet i FRA-2060).
#
# To moduser. Uten inputs er alt som før: bare `skip` på push.
#
# 1. Standard (`sparing: false`): på push slås tree-SHA opp mot tidligere vellykkede `pull_request`-kjøringer.
#    En PR-kjøring tester merge-commiten, mens API-et bare oppgir PR-ens head. Derfor teller et treff bare når
#    PR-en gikk mot samme branch og basen var en forfar til headen, for da er merge-treet lik head-treet.
#
# 2. Sparing (`sparing: true`, FRA-2060): gjelder både PR og push, og svarer `hopp-tung` og `hopp-supabase`.
#    I denne rekkefølgen, og ved all tvil kjøres alt:
#      a. Endringen mot basen rører `.github/`, lockfiler, migrasjoner eller sikkerhetsrelevant konfig: full CI.
#      b. Bare dokumentasjon: hopp over tunge jobber.
#      c. Samme tree har en fullført push-kjøring: hopp over tunge jobber.
#      d. Ellers kjører tunge jobber. Supabase hoppes bare over når ingen Supabase-filer er endret.
#
#    Hva som teller som bevis i (c), og hvorfor:
#      - Samme workflow i samme repo, `event=push`, på en beskyttet branch. Innholdet der har gått gjennom PR.
#      - Nøyaktig samme tree-SHA. Dermed er også workflow-filene i kjøringen identiske.
#      - Hver jobb i `bevis-jobber` må ha `success`. En hoppet jobb er `skipped`, så et hopp blir aldri bevis
#        for neste hopp.
#      - PR-kjøringer teller aldri her: de styres av PR-ens egen workflow-fil og tester et tree vi ikke kan se.
#      - Alle vellykkede jobber i beviset må ha kjørt på GitHub sine engangsrunnere. De egne runnerne er persistente,
#        så PR-kode kan ha lagt igjen noe som gjør en senere kjøring falskt grønn. Runner-gruppen avgjør, ikke etiketter,
#        som en egen runner kan sette selv. Av samme grunn kjører selve avgjørelsen hostet når sparing er på.
#
#    Retarget: en PR kan flyttes fra dev til main uten ny commit, og sjekkene følger head-SHA-en. Konsumenten må derfor
#    trigge på `edited`. Base endret: alt vurderes på nytt mot ny base. Bare tittel eller tekst endret: tung CI gjentas
#    ikke hvis siste kjøring på samme head og base er grønn. Ellers kjører alt, så en rød sjekk aldri blir «skipped».
#
# Jobben henter aldri PR-kode. Alt kommer fra GitHub-API-et, og filnavn behandles bare som data i jq.
#
# Bruk (se README for full oppskrift). Påkrevde sjekker må beholde navnet, så en `uses:`-jobb skal aldri
# hoppes over med `if`. Send i stedet `hopp-over` inn, slik at jobben inni blir `skipped`:
#   jobs:
#     tre:
#       uses: Framtidmedia-no/ci-workflows/.github/workflows/tree-gronn.yml@<sha>
#       permissions: { contents: read, actions: read }
#       with:
#         sparing: true
#         bevis-jobber: |
#           test
#     test:
#       needs: tre
#       # !cancelled(): feiler oppslaget, skal testen kjøre. Uten den blir testen hoppet over og ser grønn ut.
#       if: ${{ !cancelled() && needs.tre.outputs.hopp-tung != 'true' }}
name: Tre allerede grønn

on:
  workflow_call:
    inputs:
      sparing:
        description: 'Slå på gjenbruk for PR og push, docs-hopp og Supabase-deteksjon. Standard av.'
        type: boolean
        default: false
      bevis-jobber:
        description: 'Eksakte jobbnavn (ett per linje) som må ha `success` i kjøringen som brukes som bevis. Tom = ingen gjenbruk.'
        type: string
        default: ''
    outputs:
      skip:
        description: '«true» når tunge jobber kan hoppes over'
        value: ${{ jobs.sjekk.outputs.skip }}
      hopp-tung:
        description: '«true» når tunge jobber kan hoppes over (bare med sparing)'
        value: ${{ jobs.sjekk.outputs.hopp-tung }}
      hopp-supabase:
        description: '«true» når Supabase-testen kan hoppes over (bare med sparing)'
        value: ${{ jobs.sjekk.outputs.hopp-supabase }}
      grunn:
        description: Hvorfor avgjørelsen ble som den ble
        value: ${{ jobs.sjekk.outputs.grunn }}

permissions:
  contents: read
  actions: read

jobs:
  sjekk:
    name: Tre allerede grønn?
    # FRA-947: variabelen CI_RUNS_ON (JSON) i kallende repo styrer runner. Uten den: ubuntu-latest.
    runs-on: ${{ (inputs.sparing || startsWith(github.head_ref || github.ref_name, 'sentry/') || (github.event.pull_request.number && github.event.pull_request.head.repo.full_name != github.repository)) && 'ubuntu-latest' || fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 3
    outputs:
      skip: ${{ steps.s.outputs.skip }}
      hopp-tung: ${{ steps.s.outputs.hopp-tung }}
      hopp-supabase: ${{ steps.s.outputs.hopp-supabase }}
      grunn: ${{ steps.s.outputs.grunn }}
    steps:
      - id: s
        # Avgjørelsen skal aldri gjøre kjøringen rød. Krasjer den, står svarene på «kjør alt».
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          SPARING: ${{ inputs.sparing }}
          BEVIS_JOBBER: ${{ inputs.bevis-jobber }}
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HANDLING: ${{ github.event.action }}
          BASE_ENDRET: ${{ github.event.changes.base && 'true' || 'false' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # >>> avgjor
          set -uo pipefail
          arb="$(mktemp -d)"
          trap 'rm -rf "$arb"' EXIT
          ut() { printf '%s=%s\n' "$1" "$2" >> "$GITHUB_OUTPUT"; }
          ut skip false
          if [ "$SPARING" = "true" ]; then ut hopp-tung false; ut hopp-supabase false; fi

          svar() { # hopp-tung hopp-supabase grunn
            ut skip "$1"
            if [ "$SPARING" = "true" ]; then ut hopp-tung "$1"; ut hopp-supabase "$2"; fi
            ut grunn "$3"
            echo "hopp-tung=$1 hopp-supabase=$2: $3"
            echo "**CI-sparing:** tung=\`$1\` supabase=\`$2\` ($3)" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit 0
          }
          full() { svar false false "$1"; }
          tre_for() { gh api "repos/${REPO}/git/commits/$1" --jq .tree.sha 2>/dev/null; }

          if [ "$SPARING" != "true" ]; then
            [ "$EVENT" = "push" ] || svar false false "hendelsen $EVENT kjører alltid"
            tre=$(tre_for "$SHA") && [ -n "$tre" ] || svar false false "fant ikke tree"
            wf=$(gh api "repos/${REPO}/actions/runs/${RUN_ID}" --jq .workflow_id 2>/dev/null) || svar false false "fant ikke workflow"
            gh api "repos/${REPO}/actions/workflows/${wf}/runs?event=pull_request&status=success&per_page=100" > "$arb/pr.json" 2>/dev/null \
              || svar false false "fant ikke kjøringer"
            kandidater=$(jq -r --arg r "$REPO" --arg b "$REF_NAME" '
              [.workflow_runs[] | select(.head_repository.full_name == $r) | . as $k
               | (.pull_requests // [])[] | select(.base.ref == $b) | "\($k.head_sha) \(.base.sha)"] | unique | .[]' "$arb/pr.json") \
              || svar false false "kunne ikke lese kjøringer"
            while read -r kandidat base; do
              [ -n "${kandidat:-}" ] || continue
              [ "$(tre_for "$kandidat")" = "$tre" ] || continue
              status=$(gh api "repos/${REPO}/compare/${base}...${kandidat}" --jq .status 2>/dev/null) || continue
              case "$status" in
                ahead|identical) svar true true "tree ${tre} var grønt på PR-kjøring for ${kandidat}" ;;
              esac
            done <<< "$kandidater"
            svar false false "ingen tidligere grønn PR-kjøring med tree ${tre}"
          fi

          # --- Sparing. Hvilken branch endringen lander på, og er den beskyttet?
          case "$EVENT" in
            pull_request)
              [ "$HEAD_REPO" = "$REPO" ] || full "PR fra fork"
              gren="$BASE_REF" ;;
            push) gren="$REF_NAME" ;;
            *) full "hendelsen $EVENT kjører alltid" ;;
          esac
          [ -n "$gren" ] || full "fant ikke branch"
          beskyttet() {
            local kodet
            kodet=$(jq -rn --arg b "$1" '$b | @uri') || return 1
            [ "$(gh api "repos/${REPO}/branches/${kodet}" --jq .protected 2>/dev/null)" = "true" ]
          }
          beskyttet "$gren" || full "branchen $gren er ikke beskyttet"

          # --- PR redigert uten ny base: gjenta ikke tung CI hvis siste kjøring på samme head og base er grønn.
          # En rød, pågående eller avbrutt kjøring gir vanlig vurdering, så «skipped» aldri erstatter rødt.
          forrige_gronn() {
            local wf_id
            [ -n "${PR_HEAD_SHA:-}" ] || return 1
            wf_id=$(gh api "repos/${REPO}/actions/runs/${RUN_ID}" --jq .workflow_id 2>/dev/null) || return 1
            gh api "repos/${REPO}/actions/workflows/${wf_id}/runs?head_sha=${PR_HEAD_SHA}&event=pull_request&per_page=20" \
              > "$arb/forrige.json" 2>/dev/null || return 1
            jq -e --argjson selv "$RUN_ID" --arg r "$REPO" --arg b "$gren" '
              [.workflow_runs[] | select(.id != $selv)] as $k
              | ($k | max_by(.id)) as $siste
              | $siste != null
                and $siste.status == "completed" and $siste.conclusion == "success"
                and $siste.head_repository.full_name == $r
                and any($siste.pull_requests[]?; .base.ref == $b)
                and all($k[]; (.conclusion // "") | IN("failure", "timed_out", "startup_failure", "action_required") | not)
            ' "$arb/forrige.json" > /dev/null 2>&1
          }
          if [ "$EVENT" = "pull_request" ] && [ "${HANDLING:-}" = "edited" ] && [ "${BASE_ENDRET:-false}" != "true" ]; then
            if forrige_gronn; then svar true true "PR redigert uten ny base, og siste kjøring på samme head og base er grønn"; fi
          fi

          # --- Hva endres mot basen? Sammenligner hele treene, så filgrensen i compare-API-et ikke gjelder.
          gh api "repos/${REPO}/git/commits/${SHA}" > "$arb/commit.json" 2>/dev/null || full "fant ikke commit"
          tre=$(jq -er '.tree.sha' "$arb/commit.json" 2>/dev/null) || full "fant ikke tree"
          # PR: merge-commitens første forelder er basen. Push: alt siden forrige tilstand på branchen, ellers
          # ville en rebase-merge med flere commits bare blitt vurdert på den siste.
          if [ "$EVENT" = "push" ]; then
            case "$BEFORE_SHA" in
              ""|0000000000000000000000000000000000000000) full "fant ikke forrige tilstand på branchen" ;;
            esac
            forelder="$BEFORE_SHA"
          else
            forelder=$(jq -er '.parents[0].sha' "$arb/commit.json" 2>/dev/null) || full "fant ikke basen"
          fi
          base_tre=$(tre_for "$forelder") && [ -n "$base_tre" ] || full "fant ikke tree for basen"
          gh api "repos/${REPO}/git/trees/${base_tre}?recursive=1" > "$arb/base.json" 2>/dev/null || full "fant ikke basens filer"
          gh api "repos/${REPO}/git/trees/${tre}?recursive=1" > "$arb/hode.json" 2>/dev/null || full "fant ikke filene"

          # Alt avgjøres i jq, så et filnavn aldri når skallet. Stier sammenlignes med små bokstaver.
          jq -en --slurpfile a "$arb/base.json" --slurpfile b "$arb/hode.json" '
            def filer($t): $t.tree | map(select(.type != "tree")) | map({key: .path, value: {m: .mode, s: .sha}}) | from_entries;
            def alltid_full: test("^\\.github/|(^|/)(pnpm-lock\\.yaml|package-lock\\.json|npm-shrinkwrap\\.json|yarn\\.lock|bun\\.lockb?|deno\\.lock|package\\.json|pnpm-workspace\\.yaml|\\.npmrc|\\.yarnrc(\\.yml)?|\\.nvmrc|\\.node-version|\\.tool-versions|\\.gitleaks\\.toml|\\.gitleaksignore|\\.gitmodules|doppler\\.yaml|vercel\\.json|renovate\\.json5?|codeowners|dockerfile|docker-compose\\.ya?ml|(middleware|proxy|instrumentation)\\.[cm]?[jt]s)$|(^|/)\\.env|(^|/)(next|vite|vitest|playwright|eslint|tailwind|postcss)\\.config\\.|(^|/)\\.eslintrc|(^|/)tsconfig[^/]*\\.json$|(^|/)supabase/(migrations/|config\\.toml|seed)");
            def docs: (test("^docs/([^/]+/)*[^/]+\\.(md|txt)$") or test("^[^/]+\\.md$")) and (test("^(claude|agents|gemini)\\.md$") | not);
            def spesiell: . != null and (.m == "120000" or .m == "160000");
            $a[0] as $x | $b[0] as $y
            | if ($x.truncated != false) or ($y.truncated != false) then error("avkortet") else . end
            | filer($x) as $fa | filer($y) as $fb
            | (($fa + $fb) | keys | map(select($fa[.] != $fb[.]))) as $endret
            | ($endret | map(ascii_downcase)) as $sma
            | {
                antall: ($endret | length),
                full: (any($sma[]; alltid_full) or any($endret[]; ($fa[.] | spesiell) or ($fb[.] | spesiell))),
                docs: (($sma | length) > 0 and all($sma[]; docs)),
                supabase: any($sma[]; test("(^|/)supabase/"))
              }' > "$arb/endring.json" 2>/dev/null || full "kunne ikke sammenligne filene"
          read -r antall alltid docs supabase < <(jq -r '"\(.antall) \(.full) \(.docs) \(.supabase)"' "$arb/endring.json") \
            || full "kunne ikke lese sammenligningen"

          [ "$alltid" = "false" ] || full "endringen rører workflow, lockfil, migrasjon eller sikkerhetskonfig"
          [ "$docs" = "false" ] || svar true true "bare dokumentasjon ($antall filer)"

          hopp_supabase=true
          [ "$supabase" = "false" ] || hopp_supabase=false

          # --- Finnes en fullført push-kjøring av nøyaktig dette treet?
          ingen_bevis() { svar false "$hopp_supabase" "$1"; }
          [ -n "${BEVIS_JOBBER//[[:space:]]/}" ] || ingen_bevis "bevis-jobber er ikke satt"
          wf=$(gh api "repos/${REPO}/actions/runs/${RUN_ID}" --jq .workflow_id 2>/dev/null) || ingen_bevis "fant ikke workflow"
          gh api "repos/${REPO}/actions/workflows/${wf}/runs?event=push&status=success&per_page=30" > "$arb/runs.json" 2>/dev/null \
            || ingen_bevis "fant ikke kjøringer"
          jq -r --arg r "$REPO" '.workflow_runs[]
            | select(.event == "push" and .conclusion == "success" and .head_repository.full_name == $r)
            | "\(.id) \(.head_sha) \(.head_branch)"' "$arb/runs.json" > "$arb/kandidater" 2>/dev/null \
            || ingen_bevis "kunne ikke lese kjøringer"

          sjekket=0
          while read -r id kandidat kgren; do
            [ "$sjekket" -lt 15 ] || break
            sjekket=$((sjekket + 1))
            [ "$(tre_for "$kandidat")" = "$tre" ] || continue
            beskyttet "$kgren" || continue
            gh api "repos/${REPO}/actions/runs/${id}/jobs?per_page=100" > "$arb/jobber.json" 2>/dev/null || continue
            if jq -e --arg navn "$BEVIS_JOBBER" '
                 ($navn | split("\n") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))) as $krav
                 | .jobs as $j
                 | def hostet: .runner_group_id == 0 and .runner_group_name == "GitHub Actions"
                     and ((.runner_name // "") | startswith("GitHub Actions"))
                     and (any(.labels[]?; . == "self-hosted") | not);
                   ($krav | length) > 0
                   and all($krav[]; . as $k
                     | any($j[]; .name == $k) and all($j[] | select(.name == $k); .conclusion == "success"))
                   and all($j[] | select(.conclusion == "success" and (.name | test("(^|/ )Velg runner$") | not)); hostet)
               ' "$arb/jobber.json" > /dev/null 2>&1; then
              svar true true "tree ${tre} er grønt i kjøring ${id} på ${kgren}"
            fi
          done < "$arb/kandidater"
          ingen_bevis "ingen fullført push-kjøring med tree ${tre}"
          # <<< avgjor
