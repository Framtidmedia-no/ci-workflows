# Drift-sjekk for den genererte SSRF-guarden (FRA-976).
#
# Kilden er Framtidmedia-no/framtid-security (src/ssrf.ts). Konsumentene har en GENERERT kopi,
# vanligvis src/lib/net/ssrf.ts, laget med `node scripts/sync.mjs` i framtid-security. Headeren i
# fila bærer variant (plain | server-only) og sha256 av innholdet etter markørlinjen.
#
# Jobben feiler hvis fila
#   (a) mangler eller ikke er generert,
#   (b) er redigert for hånd (innholdet matcher ikke hashen i headeren), eller
#   (c) er utdatert: hashen er ikke lik gjeldende hash for varianten i security-guard.json (i dette repoet).
#
# Repoet er offentlig, så manifestet hentes uten token. Kall fra konsumenten:
#   jobs:
#     ssrf-drift:
#       uses: Framtidmedia-no/ci-workflows/.github/workflows/ssrf-drift.yml@main
#       with:
#         path: src/lib/net/ssrf.ts   # valgfritt
#         hent-bilde-path: src/lib/net/hent-bilde.ts      # valgfritt
#         eslint-path: eslint.ingen-ra-fetch.mjs          # valgfritt
name: SSRF-drift

on:
  workflow_call:
    inputs:
      path:
        description: Sti til den genererte guarden i konsumenten
        type: string
        default: src/lib/net/ssrf.ts
      hent-bilde-path:
        description: Sti til den genererte hent-bilde.ts (tom = hopp over)
        type: string
        default: ''
      eslint-path:
        description: Sti til den genererte eslint.ingen-ra-fetch.mjs (tom = hopp over)
        type: string
        default: ''

permissions:
  contents: read

jobs:
  ssrf-drift:
    name: SSRF-guard er lik kanonisk (framtid-security)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Hent manifest og sammenlign
        env:
          GUARD_PATH: ${{ inputs.path }}
          HENT_BILDE_PATH: ${{ inputs.hent-bilde-path }}
          ESLINT_PATH: ${{ inputs.eslint-path }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://raw.githubusercontent.com/Framtidmedia-no/ci-workflows/main/security-guard.json -o "$RUNNER_TEMP/security-guard.json"
          node <<'NODE'
          const { createHash } = require('node:crypto')
          const fs = require('node:fs')
          const sti = process.env.GUARD_PATH
          const MARKOR = '// ---- framtid-security:start ----'
          const L2 = '// Endringer gjøres i Framtidmedia-no/framtid-security (src/ssrf.ts) og synkes med scripts/sync.mjs.'
          const L2_TILLEGG = '// Endringer gjøres i Framtidmedia-no/framtid-security og synkes med scripts/sync.mjs.'
          const L3 = '// Drift-sjekk: Framtidmedia-no/ci-workflows/.github/workflows/ssrf-drift.yml'
          // Alt før markøren må være NØYAKTIG headerlinjene: hashen dekker bare teksten etter markøren,
          // så kode mellom header og markør (eller CRLF/ekstra linjer) ville ellers passert og kjørt.
          const lesHeader = (tekst, forsteLinje, linje2) => {
            const idx = tekst.indexOf(`${MARKOR}\n`)
            if (idx < 0) return null
            const l = tekst.slice(0, idx).split('\n')
            if (l.length !== 4 || l[3] !== '' || l[1] !== linje2 || l[2] !== L3) return null
            const m = l[0].match(forsteLinje)
            return m ? { m, idx } : null
          }
          const feil = (m) => { console.error(`::error file=${sti}::${m}`); process.exit(1) }
          if (!fs.existsSync(sti)) feil(`${sti} finnes ikke. Generer den: node scripts/sync.mjs <repo> i Framtidmedia-no/framtid-security.`)
          const tekst = fs.readFileSync(sti, 'utf8')
          const hdr = lesHeader(tekst, /^\/\/ GENERERT – ikke rediger\. Kilde: framtid-security@(\S+) \(variant: (\S+), sha256: ([0-9a-f]{64})\)$/, L2)
          if (!hdr) feil('Fila er ikke generert fra framtid-security (headeren må være eksakt de genererte linjene, ingen kode før markøren, LF-linjeskift). Ikke skriv guarden for hånd.')
          const { m, idx } = hdr
          const [, kilde, variant, hashIHeader] = m
          const hash = createHash('sha256').update(tekst.slice(idx + MARKOR.length + 1)).digest('hex')
          if (hash !== hashIHeader) feil('Fila er redigert for hånd (innholdet matcher ikke hashen i headeren). Endre i framtid-security og synk på nytt.')
          const manifest = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/security-guard.json`, 'utf8'))
          const gjeldende = manifest.sha256[variant]
          if (!gjeldende) feil(`Ukjent variant "${variant}" i headeren.`)
          if (hash !== gjeldende) feil(`Utdatert: kopien er fra framtid-security@${kilde}, gjeldende innhold har sha256 ${gjeldende.slice(0, 12)}. Kjør: node scripts/sync.mjs <repo>${variant === 'server-only' ? ' --server-only' : ''} i framtid-security.`)
          console.log(`OK: ${sti} (variant ${variant}) er lik kanonisk (sha256 ${hash.slice(0, 12)}, kilde framtid-security@${kilde})`)
          // Tilleggsfiler (hent-bilde, eslint-regel): header (navn[, import: <sti>], sha256 av kanonisk tekst).
          for (const [sti, navnForventet] of [[process.env.HENT_BILDE_PATH, 'hent-bilde'], [process.env.ESLINT_PATH, 'eslint-ingen-ra-fetch']]) {
            if (!sti) continue
            const feilT = (m) => { console.error(`::error file=${sti}::${m}`); process.exit(1) }
            if (!fs.existsSync(sti)) feilT(`${sti} finnes ikke. Generer den med scripts/sync.mjs i framtid-security.`)
            const t = fs.readFileSync(sti, 'utf8')
            const hd = lesHeader(t, /^\/\/ GENERERT – ikke rediger\. Kilde: framtid-security@(\S+) \((hent-bilde|eslint-ingen-ra-fetch)(?:, import: (\S+))?, sha256: ([0-9a-f]{64})\)$/, L2_TILLEGG)
            if (!hd) feilT('Fila er ikke generert fra framtid-security (headeren må være eksakt de genererte linjene, ingen kode før markøren, LF-linjeskift).')
            const { m: h, idx: i } = hd
            const [, k, navn, imp, hashH] = h
            if (navn !== navnForventet) feilT(`Forventet ${navnForventet}, fant ${navn}.`)
            let innhold = t.slice(i + MARKOR.length + 1)
            if (imp) innhold = innhold.replace(`from '${imp}'`, "from './ssrf.ts'")
            const hashN = createHash('sha256').update(innhold).digest('hex')
            if (hashN !== hashH) feilT('Fila er redigert for hånd. Endre i framtid-security og synk på nytt.')
            const gj = manifest.tillegg && manifest.tillegg[navn]
            if (!gj) feilT(`Manifestet mangler ${navn}.`)
            if (hashN !== gj) feilT(`Utdatert: kopien er fra framtid-security@${k}, gjeldende sha256 er ${gj.slice(0, 12)}. Synk på nytt.`)
            console.log(`OK: ${sti} (${navn}) er lik kanonisk (sha256 ${hashN.slice(0, 12)})`)
          }
          NODE
