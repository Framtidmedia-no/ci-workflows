name: Selvtest
on:
  pull_request:
permissions:
  contents: read
jobs:
  ssrf-drift:
    name: ssrf-drift.yml avviser manipulerte filer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - run: node --test tests/ssrf-drift.test.mjs
