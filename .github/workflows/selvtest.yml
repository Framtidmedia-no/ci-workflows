name: Selvtest
on:
  pull_request:
# FRA-2060: ny push avbryter forrige kjøring på samme PR. Push til main avbrytes aldri.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  ssrf-drift:
    name: ssrf-drift.yml avviser manipulerte filer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - run: node --test tests/ssrf-drift.test.mjs
  tree-gronn:
    name: tree-gronn.yml gjenbruker bare bevist grønt og kjører alt ved tvil
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - run: bash tests/tree-gronn.test.sh
  csp-sjekk:
    name: csp-sjekk gir riktige advarsler og aldri exit ≠ 0
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - run: node --test tests/csp-sjekk.test.mjs
  csp-sjekk-workflow:
    name: csp-sjekk.yml kjører ende til ende (mot dette repoet)
    uses: ./.github/workflows/csp-sjekk.yml
    with:
      ci-ref: ${{ github.event.pull_request.head.sha }}
  codex-review:
    name: codex-review.yml validerer og poster bare trygge funn
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - run: python3 tests/codex-review.test.py
  sentry-agent:
    name: sentry-agent-scriptene (port, triage, testbevis)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - run: node --test tests/sentry-agent.test.mjs
      - run: node --test tests/sentry-lukk.test.mjs
      - run: node --test tests/sentry-koble.test.mjs
      - run: node --test tests/sentry-finn-sak.test.mjs
      - run: bash tests/sentry-agent-testbevis.test.sh
