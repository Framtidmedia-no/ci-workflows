name: Selvtest supabase-live-drift
on:
  pull_request:
    paths:
      - '.github/workflows/supabase-live-drift.yml'
      - '.github/workflows/selvtest-live-drift.yml'
      - 'tests/live-drift*'
  push:
    branches: [main]
    paths:
      - '.github/workflows/supabase-live-drift.yml'
      - 'tests/live-drift*'
permissions:
  contents: read
jobs:
  live-drift:
    name: ren database er grønn og hvert avvik er rødt (engangs-Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - run: bash tests/live-drift.test.sh
